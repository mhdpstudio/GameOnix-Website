<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>GameOnix | Video</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1531408819768027"
        crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
</head>

<body class="dark-theme">
    <!-- Video-specific Loading Screen -->
    <div id="video-loading">
        <div class="video-loader-spinner"></div>
        <div class="video-loader-text">Loading video...</div>
        <div class="video-loader-progress">
            <div class="video-loader-progress-fill"></div>
        </div>
    </div>

    <button class="theme-changer"><span class="material-symbols-rounded">dark_mode</span></button>
    <button class="menu-toggle"><span class="material-symbols-rounded">menu</span></button>

    <a class="link-ads" href="ads.html" target="_blank" rel="noopener noreferrer">
        <div class="top-group" id="adBox">
            <div class="ads-element">
                <i class="fa-solid fa-rectangle-ad"></i>
                <span class="txt">Ads Support</span>
            </div>
        </div>
    </a>

    <script>
        const adBox = document.querySelector(".top-group");

        setTimeout(() => {
            adBox.classList.add("collapsed");
        }, 5000);
    </script>

    <div class="container">
        <aside class="sb closed">
            <header class="sb-h">
                <a href="../index.html" rel="noopener noreferrer">
                    <img src="../../assets/images/Logo.png" alt="Logo" class="logo" loading="lazy" decoding="async">
                    <h2 class="sb-text">GameOnix</h2>
                </a>
                <button class="sb-toggle"><span class="material-symbols-rounded">chevron_left</span></button>
            </header>

            <div class="sb-content">
                <ul class="menu-list">
                    <li class="menu-item">
                        <a href="../index.html" class="menu-link" rel="noopener noreferrer">
                            <span class="material-symbols-rounded">home</span>
                            <span class="menu-label">Home</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="games.html" class="menu-link" rel="noopener noreferrer">
                            <span class="material-symbols-rounded">stadia_controller</span>
                            <span class="menu-label">Games</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="games-news.html" class="menu-link" rel="noopener noreferrer">
                            <span class="material-symbols-rounded">newspaper</span>
                            <span class="menu-label">Games News</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="channel.html" class="menu-link" rel="noopener noreferrer">
                            <span class="material-symbols-rounded">live_tv</span>
                            <span class="menu-label">GameOnix Channel</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="apps.html" class="menu-link" rel="noopener noreferrer">
                            <span class="material-symbols-rounded">apps</span>
                            <span class="menu-label">Applacations</span>
                        </a>
                    </li>
                    <li class="menu-item">
                        <a href="request-game.html" class="menu-link" rel="noopener noreferrer">
                            <span class="material-symbols-rounded">person_raised_hand</span>
                            <span class="menu-label">Request Game</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="sb-footer">
                <ul class="menu-list" style="list-style: none;">
                    <li class="menu-item">
                        <a href="donations.html" class="menu-link" rel="noopener noreferrer">
                            <span class="material-symbols-rounded">volunteer_activism</span>
                            <span class="menu-label">Support Us</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <div class="content">
            <div id="video-container"></div>
        </div>
    </div>

    <script>
        // Anti-right-click + dev tools block
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && ['u', 's', 'p'].includes(e.key) || e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key))) {
                e.preventDefault();
            }
        });
    </script>

    <script>
        const version = new Date().getTime();

        // 1. CSS first
        const cssFiles = [
            "../css/sidebar-style.css?v=" + version,
            "../css/ads-style.css?v=" + version,
            "../css/video-page.css?v=" + version,
            "../css/theme-btn.css?v=" + version,
            "../css/player-style.css?v=" + version,
            "../css/video-loading.css?v=" + version,  // Video-specific
            "../css/top-element.css?v=" + version
        ];
        cssFiles.forEach(href => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            document.head.appendChild(link);
        });

        // 2. Video loading manager FIRST
        const videoLoadingScript = document.createElement("script");
        videoLoadingScript.src = "../js/video-loading.js?v=" + version;
        videoLoadingScript.onload = () => console.log("Video loader ready");
        document.body.appendChild(videoLoadingScript);

        // 3. Content scripts with delay
        setTimeout(() => {
            const scripts = [
                "../js/video-page.js?v=" + version,
                "../js/sidebar-script.js?v=" + version,
                "../js/icon.js?v=" + version
            ];
            scripts.forEach(src => {
                const script = document.createElement("script");
                script.src = src;
                document.body.appendChild(script);
            });
        }, 200);
    </script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../../sw_1.js');
        }
    </script>

</html>
