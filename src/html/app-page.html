<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>App Details</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
</head>

<body class="dark-theme">
    <!-- Loading Screen managed by shared JS/CSS -->

    <button class="theme-changer"><span class="material-symbols-rounded">dark_mode</span></button>
    <button class="menu-toggle"><span class="material-symbols-rounded">menu</span></button>

    <a class="link-ads" href="ads.html" target="_blank" rel="noopener noreferrer">
        <div class="top-group" id="adBox">
            <div class="ads-element">
                <i class="fa-solid fa-rectangle-ad"></i>
                <span class="txt">Ads Support</span>
            </div>
        </div>
    </a>

    <script>
        const adBox = document.querySelector(".top-group");

        setTimeout(() => {
            adBox.classList.add("collapsed");
        }, 5000);
    </script>

    <div class="container">
        <div id="sidebar-container"></div>

        <div class="content">
            <div id="app-page"></div>
        </div>
    </div>

    <div id="sharePopup" class="share-popup">
        <div class="share-box">
            <h3>Share this app</h3>

            <div class="share-input">
                <input id="shareLink" readonly>
                <button id="copyBtn">Copy</button>
            </div>

            <button class="close-share">Close</button>
        </div>
    </div>

    <!-- Disable right-click, Ctrl+U, F12, and Developer Tools -->
    <script>
        // Disable right-click context menu
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        // Disable keyboard shortcuts for viewing source and developer tools
        document.addEventListener('keydown', function (e) {
            // Disable Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                return false;
            }
            // Disable F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+I (Developer Tools)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+C (Inspector)
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+S (Save)
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+P (Print)
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                return false;
            }
        });

        // Additional protection: Clear selection on mousedown to prevent text selection
        document.addEventListener('mousedown', function (e) {
            if (e.button === 0) { // Left click
                // Allow normal left click functionality
            }
        });
    </script>

</body>

<script>
    const version = new Date().getTime(); // رقم نسخة ديناميكي

    // CSS Files
    const cssFiles = [
        "../css/sidebar-style.css",
        "../css/theme-btn.css",
        "../css/app-page.css",
        "../css/loading-screen.css",
        "../css/top-element.css"
    ];
    cssFiles.forEach(file => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `${file}?v=${version}`;
        document.head.appendChild(link);
    });

    // Loading manager
    const loadingScript = document.createElement("script");
    loadingScript.src = `../js/loading-manager.js?v=${version}`;
    document.body.appendChild(loadingScript);

    // JS Files
    const jsFiles = [
        "../js/components/sidebar-comp.js",
        "../js/icon.js",
        "../js/app-page.js",
        "../js/app-page-events.js"
    ];
    jsFiles.forEach(file => {
        const script = document.createElement("script");
        script.src = `${file}?v=${version}`;
        document.body.appendChild(script);
    });
</script>



<!-- Service Worker for automatic cache busting -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../../sw_1.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed:', err));
    }
</script>

</html>
