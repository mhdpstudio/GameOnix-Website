    <!-- Disable right-click, Ctrl+U, F12, and Developer Tools -->
    <script>
        // Disable right-click context menu
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        // Disable keyboard shortcuts for viewing source and developer tools
        document.addEventListener('keydown', function (e) {
            // Disable Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                return false;
            }
            // Disable F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+I (Developer Tools)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+C (Inspector)
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+S (Save)
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+P (Print)
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                return false;
            }
        });

        // Additional protection: Clear selection on mousedown to prevent text selection
        document.addEventListener('mousedown', function (e) {
            if (e.button === 0) { // Left click
                // Allow normal left click functionality
            }
        });
    </script>

<script>
    const version = new Date().getTime(); // رقم نسخة ديناميكي

    // CSS Files
    const cssFiles = [
        "../css/sidebar-style.css",
        "../css/ads-style.css",
        "../css/game-page.css",
        "../css/theme-btn.css",
        "../css/loading-screen.css",
        "../css/top-element.css"
    ];
    cssFiles.forEach(file => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `${file}?v=${version}`;
        document.head.appendChild(link);
    });

    // Loading manager
    const loadingScript = document.createElement("script");
    loadingScript.src = `../js/loading-manager.js?v=${version}`;
    document.body.appendChild(loadingScript);

    // JS Files
    const jsFiles = [
        "../js/game-page.js",
        "../js/sidebar-script.js",
        "../js/icon.js"
    ];
    jsFiles.forEach(file => {
        const script = document.createElement("script");
        script.src = `${file}?v=${version}`;
        document.body.appendChild(script);
    });
</script>

<script>
    // Hide loading screen when page is fully loaded (with 1 second delay)
    // Skip loading screen if page is loaded from bfcache (back-forward cache)
    // Enhanced loading screen - persists on back/forward, detects image loading
    window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        if (!loadingScreen) return;

        const navEntry = performance.getEntriesByType('navigation')[0];
        const navType = navEntry?.type || 'navigate';

        if (['back_forward', 'prerender', 'reload'].includes(navType)) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.visibility = 'hidden';
            setTimeout(() => loadingScreen.remove(), 200);
            return;
        }

        const imgLoading = document.images.length > 0 &&
            Array.from(document.images).some(img => !img.complete);

        const timeout = imgLoading ? 1200 : 400;

        setTimeout(() => {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.visibility = 'hidden';
            setTimeout(() => loadingScreen.remove(), 300);
        }, timeout);
    });
</script>

<!-- Service Worker for automatic cache busting -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../../sw_1.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed:', err));
    }
</script>
