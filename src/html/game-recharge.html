<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>GameOnix | Recharge Games</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
</head>

<body class="dark-theme">
    <!-- Loading Screen managed by shared JS/CSS -->

    <button class="theme-changer"><span class="material-symbols-rounded">dark_mode</span></button>
    <button class="menu-toggle"><span class="material-symbols-rounded">menu</span></button>


    <script>
        const adBox = document.querySelector(".top-group");

        setTimeout(() => {
            adBox.classList.add("collapsed");
        }, 5000);
    </script>

    <div class="container">
        <div id="sidebar-container"></div>

        <div class="content">
            <div class="game-page">
                <div class="game-box">
                    <div class="game-left">
                        <img id="gameImage" />
                    </div>

                    <div class="game-right">
                        <h1 class="title" id="gameTitle"></h1>

                        <div class="meta">
                            <span class="meta-btn"><i class="fa-solid fa-bolt"></i> Instant</span>
                            <span class="meta-btn"><i class="fa-solid fa-shield"></i> Validity Guarantee</span>
                            <span class="meta-btn"><i class="fa-solid fa-clock"></i> 1 ~ 15 Min</span>
                        </div>

                        <h2 class="label"><i class="fa-solid fa-money-bill"></i> Select Amount</h2>

                        <div class="packs" id="packsContainer"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="successModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">
                <span class="material-symbols-rounded">check_circle</span>
            </div>
            <h2 class="modal-title">Your Request Submitted</h2>
            <p class="modal-text">Your game request has been received. Our team is on it, you will be notified soon,
                Check your Whatsapp or your E-mail</p>
            <button type="button" class="modal-close-btn" id="closeModal">Back to Base</button>
        </div>
    </div>
    <!-- Disable right-click, Ctrl+U, F12, and Developer Tools -->
    <script>
        // Disable right-click context menu
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        // Disable keyboard shortcuts for viewing source and developer tools
        document.addEventListener('keydown', function (e) {
            // Disable Ctrl+U (View Source)
            if (e.ctrlKey && e.key === 'u') {
                e.preventDefault();
                return false;
            }
            // Disable F12 (Developer Tools)
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+I (Developer Tools)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+C (Inspector)
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+S (Save)
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                return false;
            }
            // Disable Ctrl+P (Print)
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                return false;
            }
        });

        // Additional protection: Clear selection on mousedown to prevent text selection
        document.addEventListener('mousedown', function (e) {
            if (e.button === 0) { // Left click
                // Allow normal left click functionality
            }
        });
    </script>

</body>

<script>
    const version = new Date().getTime(); // رقم نسخة ديناميكي

    // CSS Files
    const cssFiles = [
        "../css/sidebar-style.css",
        "../css/ads-style.css",
        "../css/recharge-game-page.css",
        "../css/theme-btn.css",
        "../css/loading-screen.css",
        "../css/top-element.css"
    ];
    cssFiles.forEach(file => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = `${file}?v=${version}`;
        document.head.appendChild(link);
    });

    // Loading manager
    const loadingScript = document.createElement("script");
    loadingScript.src = `../js/loading-manager.js?v=${version}`;
    document.body.appendChild(loadingScript);

    // JS Files
    const jsFiles = [
        "../js/recharge-game-page.js",
        "../js/components/sidebar-comp.js",
        "../js/icon.js"
    ];
    jsFiles.forEach(file => {
        const script = document.createElement("script");
        script.src = `${file}?v=${version}`;
        document.body.appendChild(script);
    });
</script>

<script>
    // Hide loading screen when page is fully loaded (with 1 second delay)
    // Skip loading screen if page is loaded from bfcache (back-forward cache)
    // Enhanced loading screen - persists on back/forward, detects image loading
    window.addEventListener('load', () => {
        const loadingScreen = document.getElementById('loading-screen');
        if (!loadingScreen) return;

        const navEntry = performance.getEntriesByType('navigation')[0];
        const navType = navEntry?.type || 'navigate';

        if (['back_forward', 'prerender', 'reload'].includes(navType)) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.visibility = 'hidden';
            setTimeout(() => loadingScreen.remove(), 200);
            return;
        }

        const imgLoading = document.images.length > 0 &&
            Array.from(document.images).some(img => !img.complete);

        const timeout = imgLoading ? 1200 : 400;

        setTimeout(() => {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.visibility = 'hidden';
            setTimeout(() => loadingScreen.remove(), 300);
        }, timeout);
    });
</script>

<!-- Service Worker for automatic cache busting -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../../sw_1.js')
            .then(reg => console.log('Service Worker registered'))
            .catch(err => console.log('Service Worker registration failed:', err));
    }
</script>

</html>
