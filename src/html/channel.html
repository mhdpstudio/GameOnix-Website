<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>GameOnix | Channel</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1531408819768027"
        crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="../../assets/images/logo.png">
</head>

<body class="dark-theme">
    <!-- Channel-specific Loading Screen - SAME as video -->
    <div id="channel-loading">
        <div class="video-loader-spinner"></div>
        <div class="video-loader-text">Loading channel videos...</div>
        <div class="video-loader-progress">
            <div class="video-loader-progress-fill"></div>
        </div>
    </div>

    <button class="theme-changer"><span class="material-symbols-rounded">dark_mode</span></button>
    <button class="menu-toggle"><span class="material-symbols-rounded">menu</span></button>

    <a class="link-ads" href="ads.html" target="_blank" rel="noopener noreferrer">
        <div class="top-group" id="adBox">
            <div class="ads-element">
                <i class="fa-solid fa-rectangle-ad"></i>
                <span class="txt">Ads Support</span>
            </div>
        </div>
    </a>

    <script>
        const adBox = document.querySelector(".top-group");

        setTimeout(() => {
            adBox.classList.add("collapsed");
        }, 5000);
    </script>

    <div class="container">
        <div id="sidebar-container"></div>

        <div class="content">
            <div class="profile-header">
                <div class="profile-pic">
                    <img src="../../assets/videos/pics/logo/logo-vd.webp" class="channel-logo" alt="Profile Picture">
                </div>
                <div class="profile-details">
                    <div class="reach">
                        <div class="reach-item">
                            <span class="material-symbols-rounded">visibility</span>
                            <span class="reach-count" id="watch">0</span>
                        </div>
                        <div class="reach-item">
                            <span class="material-symbols-rounded">thumb_up</span>
                            <span class="reach-count" id="likes">0</span>
                        </div>
                        <div class="reach-item">
                            <span class="material-symbols-rounded">videocam</span>
                            <span class="reach-count" id="videos">0</span>
                        </div>
                    </div>

                    <div class="profile-info">
                        <div class="title-main">
                            <h1 class="profile-name">GameOnix</h1>
                            <i class="fa-solid fa-share" id="openShare"></i>
                        </div>
                        <p class="profile-handle">@GameOnix | Mahmoud Pro</p>
                        <p class="profile-more">Hey everyone, I'll be explaining, playing, and solving game problems and
                            all
                            kinds of game issues.</p>
                    </div>
                </div>
            </div>

            <div id="channel-page"></div>
        </div>
    </div>

    <div id="sharePopup" class="share-popup">
        <div class="share-box">
            <h3>Share this Channel</h3>

            <div class="share-input">
                <input id="shareLink" readonly>
                <button id="copyBtn">Copy</button>
            </div>

            <button class="close-share">Close</button>
        </div>
    </div>

    <script>
        // Anti-dev tools
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && ['u', 's', 'p'].includes(e.key) || e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key))) {
                e.preventDefault();
            }
        });
    </script>

    <script>
        const version = new Date().getTime();

        // CSS Files
        const cssFiles = [
            "../css/sidebar-style.css?v=" + version,
            "../css/ads-style.css?v=" + version,
            "../css/channel-page.css?v=" + version,
            "../css/theme-btn.css?v=" + version,
            "../css/video-loading.css?v=" + version,
            "../css/top-element.css?v=" + version
        ];
        cssFiles.forEach(href => {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = href;
            document.head.appendChild(link);
        });

        // 1. Channel loading manager FIRST (same as video-loading.js logic)
        const channelLoadingScript = document.createElement("script");
        channelLoadingScript.textContent = `
            // Channel page dedicated loader - IDENTICAL to video-loading.js
            (function() {
                const loadingScreen = document.getElementById('channel-loading');
                const hideLoading = () => {
                    loadingScreen.classList.add('hidden');
                    setTimeout(() => loadingScreen.remove(), 600);
                };
                
                let readyCount = 0;
                // Progress animation + hide\n                document.addEventListener('channel-videos-ready', () => {\n                    // Animate progress fill\n                    const progressFill = loadingScreen.querySelector('.video-loader-progress-fill');\n                    progressFill.style.transition = 'width 0.8s ease';\n                    progressFill.style.width = '100%';\n                    \n                    setTimeout(hideLoading, 1200); // After animation\n                }, { once: true });
                
        setTimeout(() => {\n            readyCount = 1;\n            hideLoading();\n        }, 4000); // Faster for channel - no heavy video
                
                console.log('Channel loader active');
            })();
        `;
        document.body.appendChild(channelLoadingScript);

        // 2. Content scripts after delay
        setTimeout(() => {
            const scripts = [
                "../js/channel-page.js?v=" + version,
                "../js/components/sidebar-comp.js?v=" + version,
                "../js/icon.js?v=" + version
            ];
            scripts.forEach(src => {
                const script = document.createElement("script");
                script.src = src;
                document.body.appendChild(script);
            });
        }, 300);
    </script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../../sw_1.js');
        }
    </script>

</html>
